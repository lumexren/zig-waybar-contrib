name: Build

on:
  workflow_dispatch:
  push:
    paths:
      - ".forgejo/workflows/build.yml"
      - "src/**"
      - "build.zig"
      - "build.zig.zon"
  pull_request:
    paths:
      - ".forgejo/workflows/build.yml"
      - "src/**"
      - "build.zig"
      - "build.zig.zon"

jobs:
  build:
    runs-on: [codeberg-medium]
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          apt update
          apt install -y libdbus-1-dev pkg-config build-essential

      - name: Install Zig
        uses: https://codeberg.org/mlugg/setup-zig@v2
        with:
          version: master

      - name: Build
        run: |
          zig build
          mv zig-out/bin zig-out-debug
          zig build -Drelease
          mv zig-out/bin zig-out-release

      - name: Set Version
        id: version
        run: |
          VERSION="$(date +'%y.%m.%d')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload Debug Binaries
        uses: actions/upload-artifact@v3
        with:
          name: ${{ github.event.repository.name }}-debug-${{ steps.version.outputs.version }}-${{ github.run_id }}
          path: zig-out-debug/*
          retention-days: 7

      - name: Upload Release Binaries
        uses: actions/upload-artifact@v3
        with:
          name: ${{ github.event.repository.name }}-release-${{ steps.version.outputs.version }}-${{ github.run_id }}
          path: zig-out-release/*
          retention-days: 7