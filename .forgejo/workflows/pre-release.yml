name: Pre-Release

permissions:
  contents: write

on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: [codeberg-medium]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Dependencies
        run: |
          apt update
          apt install -y libdbus-1-dev pkg-config build-essential zip curl

      - name: Install Zig
        uses: https://codeberg.org/mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build Project
        run: |
          zig build
          mv zig-out/bin zig-out-debug
          zig build -Drelease
          mv zig-out/bin zig-out-release

      - name: Set Version
        run: echo "VERSION=$(date +'%y.%m.%d')" >> "$GITHUB_ENV"

      - name: Create and Push Git Tag
        run: |
          git config user.name "forgejo-actions"
          git config user.email "actions@codeberg.org"
          git remote set-url origin "https://x-access-token:${{ github.token }}@codeberg.org/${{ github.repository }}.git"

          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists, skipping."
          else
            git tag "$VERSION"
            git push origin "$VERSION"
          fi

      - name: Generate Changelog
        run: |
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          if [ -z "$PREVIOUS_TAG" ]; then
            echo "Initial release." > release_notes.md
          else
            echo "### Changes since $PREVIOUS_TAG" > release_notes.md
            git log "${PREVIOUS_TAG}..HEAD" --oneline --format="- %s (%h)" >> release_notes.md
          fi

      - name: Package Builds
        run: |
          DEBUG_FILENAME="zig-waybar-contrib-debug-${{ env.VERSION }}.zip"
          RELEASE_FILENAME="zig-waybar-contrib-release-${{ env.VERSION }}.zip"

          (cd zig-out-debug && zip -r "../$DEBUG_FILENAME" .)
          (cd zig-out-release && zip -r "../$RELEASE_FILENAME" .)

          echo "DEBUG_FILENAME=$DEBUG_FILENAME" >> "$GITHUB_ENV"
          echo "RELEASE_FILENAME=$RELEASE_FILENAME" >> "$GITHUB_ENV"

      - name: Create Release
        uses: https://gitea.com/actions/gitea-release-action@v1
        with:
          tag_name: ${{ env.VERSION }}
          name: ${{ env.VERSION }}
          body_path: release_notes.md
          prerelease: true
          md5sum: true
          files: |
            ${{ env.DEBUG_FILENAME }}
            ${{ env.RELEASE_FILENAME }}

      - name: Update AUR Package
        uses: docker://archlinux:latest
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
          VERSION: ${{ env.VERSION }}
          RELEASE_FILENAME: ${{ env.RELEASE_FILENAME }}
          REPO_URL: "https://codeberg.org/${{ github.repository }}"
          AUR_REPO: "zig-waybar-contrib-beta-bin"
        with:
          entrypoint: bash
          args: ${{ github.workspace }}/scripts/aur.sh