name: Pre-Release

permissions:
  contents: write

on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: [codeberg-medium]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Dependencies
        run: |
          apt update
          apt install -y libdbus-1-dev pkg-config build-essential zip curl

      - name: Install Zig
        uses: https://codeberg.org/mlugg/setup-zig@v2
        with:
          version: master

      - name: Build Project
        run: |
          zig build
          mv zig-out zig-out-debug
          zig build -Drelease
          mv zig-out zig-out-release

      - name: Set Version
        id: set_version
        run: |
          VERSION=$(date +'%y.%m.%d')
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Create and Push Git Tag
        run: |
          git config user.name "forgejo-actions"
          git config user.email "actions@codeberg.org"
          git remote set-url origin https://x-access-token:${{ github.token }}@codeberg.org/${{ github.repository }}.git
          
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists."
          else
            git tag $VERSION
            git push origin $VERSION
          fi

      - name: Generate Changelog
        id: changelog
        run: |
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREVIOUS_TAG" ]; then
            echo "Initial release." > release_notes.md
          else
            echo "### Changes since $PREVIOUS_TAG" > release_notes.md
            git log ${PREVIOUS_TAG}..HEAD --oneline --format="- %s (%h)" >> release_notes.md
          fi

      - name: Package Builds
        run: |
          RELEASE_FILENAME="zig-waybar-contrib-release-${{ env.VERSION }}.zip"
          zip -r zig-waybar-contrib-debug-${{ env.VERSION }}.zip zig-out-debug/
          zip -r $RELEASE_FILENAME zig-out-release/
          echo "RELEASE_FILENAME=$RELEASE_FILENAME" >> $GITHUB_ENV

      - name: Create Release
        uses: https://gitea.com/actions/gitea-release-action@v1
        with:
          tag_name: ${{ env.VERSION }}
          name: ${{ env.VERSION }}
          body_path: release_notes.md
          prerelease: true
          md5sum: true
          files: |
            zig-waybar-contrib-debug-${{ env.VERSION }}.zip
            ${{ env.RELEASE_FILENAME }}

      - name: Update AUR Package
        uses: docker://archlinux:latest
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
          VERSION: ${{ env.VERSION }}
          RELEASE_FILENAME: ${{ env.RELEASE_FILENAME }}
          REPO_URL: "https://codeberg.org/${{ github.repository }}"
        with:
          entrypoint: bash
          args: |
            -c '
            set -e
      
            pacman-key --init
            pacman-key --populate archlinux
            pacman -Sy --noconfirm archlinux-keyring
            pacman -Sy --noconfirm openssh git pacman-contrib curl base-devel
      
            mkdir -p /root/.ssh
            echo "$AUR_SSH_KEY" > /root/.ssh/id_ed25519
            chmod 600 /root/.ssh/id_ed25519
            ssh-keyscan aur.archlinux.org >> /root/.ssh/known_hosts
      
            git config --global user.name "erffy"
            git config --global user.email "${{ secrets.EMAIL }}"
            git config --global --add safe.directory "*"
      
            git clone ssh://aur@aur.archlinux.org/zig-waybar-contrib-beta-bin.git aur-repo
            cd aur-repo
            cp "$GITHUB_WORKSPACE/aur/zig-waybar-contrib-beta-bin/PKGBUILD" PKGBUILD
            
            BINARY_URL="${REPO_URL}/releases/download/${VERSION}/${RELEASE_FILENAME}"
            CONFIG_URL="${REPO_URL}/raw/tag/${VERSION}/config.waybar.jsonc"
            LICENSE_URL="${REPO_URL}/raw/tag/${VERSION}/LICENSE"
      
            sed -i "s|^pkgver=.*|pkgver=${{ env.VERSION }}|" PKGBUILD
            sed -i "s|^pkgrel=.*|pkgrel=1|" PKGBUILD
            sed -i "s|DOWNLOAD_URL|${BINARY_URL}|g" PKGBUILD
            sed -i "s|CONFIG_DOWNLOAD_URL|${CONFIG_URL}|g" PKGBUILD
            sed -i "s|LICENSE_DOWNLOAD_URL|${LICENSE_URL}|g" PKGBUILD
      
            curl -L -o zig-waybar-contrib.zip "${BINARY_URL}"
            curl -L -o config.waybar.jsonc "${CONFIG_URL}"
            curl -L -o LICENSE "${LICENSE_URL}"
      
            useradd -m builduser
            chown -R builduser .

            su builduser -s /bin/bash -c "updpkgsums"
            su builduser -s /bin/bash -c "makepkg --printsrcinfo" > .SRCINFO
      
            rm zig-waybar-contrib.zip config.waybar.jsonc LICENSE
      
            git add PKGBUILD .SRCINFO
      
            if git diff-index --quiet HEAD; then
              echo "No changes detected. Skipping push."
            else
              git commit -m "release: update to ${{ env.VERSION }}"
              git push origin master
              echo "AUR updated successfully!"
            fi
            '