name: Build Master CI

on:
  push:
    paths:
      - ".forgejo/workflows/ci.yml"
      - "src/**"
      - "build.zig"
      - "build.zig.zon"
  pull_request:
    paths:
      - ".forgejo/workflows/ci.yml"
      - "src/**"
      - "build.zig"
      - "build.zig.zon"

jobs:
  build-standard:
    runs-on: [server]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          apt update
          apt install -y libdbus-1-dev pkg-config build-essential

      - name: Install Zig
        uses: https://codeberg.org/mlugg/setup-zig@v2
        with:
          version: master

      - name: Build
        run: zig build -Drelease

      - name: Upload binaries
        uses: actions/upload-artifact@v3
        with:
          name: zig-waybar-contrib
          path: zig-out/bin/*