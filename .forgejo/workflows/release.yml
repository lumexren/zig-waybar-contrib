name: Release

permissions:
  contents: write

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: [codeberg-medium]
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_filename: ${{ steps.package.outputs.release_filename }}
      debug_filename: ${{ steps.package.outputs.debug_filename }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Dependencies
        run: |
          apt update
          apt install -y libdbus-1-dev pkg-config build-essential zip curl

      - name: Install Zig
        uses: https://codeberg.org/mlugg/setup-zig@v2
        with:
          version-file: .zigversion

      - name: Run Tests
        run: zig build test

      - name: Build debug
        run: |
          zig build
          mv zig-out/bin zig-out-debug

      - name: Build release
        run: |
          zig build -Doptimize=small
          mv zig-out/bin zig-out-release

      - name: Set Version
        id: version
        run: |
          VERSION=$(grep -oP '\.version\s*=\s*"\K[0-9]+\.[0-9]+\.[0-9]+' build.zig.zon)
          if [ -z "$VERSION" ]; then
            echo "Error: Version not found in build.zig.zon"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create and Push Git Tag
        env:
          EMAIL: ${{ secrets.EMAIL }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sed -i "s/\.version = \"[^\"]*\"/\.version = \"${VERSION}\"/" build.zig.zon

          git config user.name "erenvly"
          git config user.email "${EMAIL}"
          git remote set-url origin "https://x-access-token:${{ github.token }}@codeberg.org/${{ github.repository }}.git"

          if ! git diff --quiet build.zig.zon; then
            git commit -am "chore(release): release ${VERSION} [skip ci]"
            git push origin "${GITHUB_REF_NAME}"
          fi

          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists, skipping."
          else
            git tag "$VERSION"
            git push origin "$VERSION"
          fi

      - name: Generate Changelog
        run: |
          PREVIOUS_TAG="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")"

          if [[ -z "$PREVIOUS_TAG" ]]; then
            echo "Initial release." > release_notes.md
          else
            echo "### Changes since $PREVIOUS_TAG" > release_notes.md
            git log "${PREVIOUS_TAG}..HEAD" --oneline --format="- %s (%h)" >> release_notes.md
          fi

          if [[ -f .zigversion ]]; then
            ZIG_VERSION=$(cat .zigversion | xargs)
            ZIG_COMPILER_VERSION=$(zig version)
            echo -e "\n\n<sub>This release is based on $ZIG_VERSION</sub>\n<sub>Compiled with $ZIG_COMPILER_VERSION</sub>" >> release_notes.md
          fi

      - name: Package Builds
        id: package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          DEBUG_FILENAME="${{ github.event.repository.name }}-debug-${VERSION}.zip"
          RELEASE_FILENAME="${{ github.event.repository.name }}-release-${VERSION}.zip"

          (cd zig-out-debug && zip -r "../$DEBUG_FILENAME" .)
          (cd zig-out-release && zip -r "../$RELEASE_FILENAME" .)

          echo "debug_filename=$DEBUG_FILENAME" >> "$GITHUB_OUTPUT"
          echo "release_filename=$RELEASE_FILENAME" >> "$GITHUB_OUTPUT"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: release-zips
          path: |
            ${{ steps.package.outputs.debug_filename }}
            ${{ steps.package.outputs.release_filename }}
            release_notes.md

  publish:
    runs-on: [codeberg-medium]
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v3
        with:
          name: release-zips

      - name: Create Release
        uses: https://gitea.com/actions/gitea-release-action@v1
        with:
          tag_name: ${{ needs.build.outputs.version }}
          name: ${{ needs.build.outputs.version }}
          body_path: release_notes.md
          prerelease: false
          md5sum: true
          files: |
            ${{ needs.build.outputs.debug_filename }}
            ${{ needs.build.outputs.release_filename }}

      - name: Update AUR Package
        uses: docker://archlinux:latest
        env:
          EMAIL: ${{ secrets.EMAIL }}
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
          VERSION: ${{ needs.build.outputs.version }}
          RELEASE_FILENAME: ${{ needs.build.outputs.release_filename }}
          REPO_URL: "https://codeberg.org/${{ github.repository }}"
          AUR_REPO: "${{ github.event.repository.name }}"
          GITHUB_WORKSPACE: ${{ github.workspace }}
        with:
          entrypoint: bash
          args: ${{ github.workspace }}/aur/release.sh