name: Release

permissions:
  contents: write

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libdbus-1-dev zip

      - name: Install Zig
        uses: mlugg/setup-zig@v2

      - name: Run Tests
        run: zig build test

      - name: Build debug
        run: |
          zig build
          mv zig-out/bin zig-out-debug

      - name: Build release
        run: |
          zig build -Doptimize=small
          mv zig-out/bin zig-out-release

      - name: Set Version
        id: version
        run: |
          VERSION=$(grep -oP '\.version\s*=\s*"\K[0-9]+\.[0-9]+\.[0-9]+' build.zig.zon)
          if [ -z "$VERSION" ]; then
            echo "Error: Version not found in build.zig.zon"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create and Push Git Tag
        env:
          EMAIL: ${{ secrets.EMAIL }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sed -i "s/\.version = \"[^\"]*\"/\.version = \"${VERSION}\"/" build.zig.zon

          git config user.name "lumexren"
          git config user.email "${EMAIL:-lumexren@users.noreply.github.com}"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"

          if ! git diff --quiet build.zig.zon; then
            git commit -am "chore(release): release ${VERSION} [skip ci]"
            git push origin "${{ github.ref_name }}"
          fi

          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists, skipping."
          else
            git tag "$VERSION"
            git push origin "$VERSION"
          fi

      - name: Generate Changelog
        run: |
          bash .github/scripts/generate-changelog.sh \
            --mode stable \
            --version "${{ steps.version.outputs.version }}" \
            --output release_notes.md

      - name: Package Builds
        id: package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          DEBUG_FILENAME="${{ github.event.repository.name }}-debug-${VERSION}.zip"
          RELEASE_FILENAME="${{ github.event.repository.name }}-release-${VERSION}.zip"

          (cd zig-out-debug && zip -r "../$DEBUG_FILENAME" .)
          (cd zig-out-release && zip -r "../$RELEASE_FILENAME" .)

          echo "debug_filename=$DEBUG_FILENAME" >> "$GITHUB_OUTPUT"
          echo "release_filename=$RELEASE_FILENAME" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          body_path: release_notes.md
          prerelease: false
          files: |
            ${{ steps.package.outputs.debug_filename }}
            ${{ steps.package.outputs.release_filename }}

      - name: Update AUR Package
        uses: docker://archlinux:latest
        env:
          EMAIL: ${{ secrets.EMAIL }}
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_FILENAME: ${{ steps.package.outputs.release_filename }}
          REPO_URL: "https://github.com/${{ github.repository }}"
          AUR_REPO: "${{ github.event.repository.name }}"
          GITHUB_WORKSPACE: ${{ github.workspace }}
        with:
          entrypoint: bash
          args: aur/release.sh
